services:

  database:
    # Minor updates (17.x) only bring fixes: `docker-compose pull database` and
    # restart to pick them up. A major upgrade needs a dump and restore.
    image: "postgres:17-alpine"
    restart: always
    ports:
      # Direct access, for the move to pgbouncer. Once every client uses 6432,
      # change it to "127.0.0.1:5432:5432" and close 5432 in the security group.
      - "5432:5432"
    env_file:
      - .db.env
    # Sized for a t4g.small (2 GB RAM). Clients go through pgbouncer, which
    # keeps ~20 server connections, so 100 leaves room for admin tools.
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      # Connections left idle by clients that died (e.g. frozen serverless
      # functions) are closed instead of piling up to max_connections.
      - -c
      - idle_session_timeout=5min
      - -c
      - idle_in_transaction_session_timeout=1min
      # Log queries slower than 500ms.
      - -c
      - log_min_duration_statement=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - dbdata:/var/lib/postgresql/data
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: just-a-db/database-logs

  # Connection pooler in front of Postgres: clients connect to 6432 (TLS
  # required), and thousands of client connections share a few real ones.
  pgbouncer:
    image: just-a-db-pgbouncer
    build:
      context: ./pgbouncer
    restart: always
    ports:
      - "6432:6432"
    env_file:
      - .db.env
    # max_client_conn needs one file descriptor per client connection.
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    volumes:
      - ./certs:/certs:ro
    depends_on:
      database:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: just-a-db/database-logs

  backups:
    image: just-a-db-backups
    build:
      context: ./backups
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .db.env
      - .backup.env
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: just-a-db/backups-logs

volumes:
  dbdata: {}
